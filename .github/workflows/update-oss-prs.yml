name: Update open-source contributions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_oss_table.py

      - name: Commit if it changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Readme.md
          git commit -m "Update open-source contributions table"
          git push
